<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌐 多國語言旅行小卡 (日語 / 韓語 / 英語)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --primary-light: #ede9fe;
      --accent-jp: #ef4444;
      --accent-kr: #0ea5e9;
      --accent-en: #10b981;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
    }

    [data-theme="dark"] {
      --bg-base: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --primary: #a78bfa;
      --primary-hover: #8b5cf6;
      --primary-light: rgba(167, 139, 250, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', 'Noto Sans JP', 'Noto Sans KR', sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 30px;
    }

    /* 頂部導覽列 */
    header {
      width: 100%;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* 主內容容器 */
    .app-wrap {
      width: 100%;
      max-width: 640px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 語言切換 Segmented Pills */
    .lang-switcher-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 6px;
      display: flex;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    .lang-pill-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .lang-pill-btn.active[data-lang="ja"] {
      background: #fee2e2;
      color: #b91c1c;
      box-shadow: var(--shadow-sm);
    }
    .lang-pill-btn.active[data-lang="ko"] {
      background: #e0f2fe;
      color: #0369a1;
      box-shadow: var(--shadow-sm);
    }
    .lang-pill-btn.active[data-lang="en"] {
      background: #dcfce7;
      color: #15803d;
      box-shadow: var(--shadow-sm);
    }

    /* 組句結果面板 (動態句子卡) */
    .sentence-board {
      background: var(--bg-card);
      border: 2px dashed var(--border-color);
      border-radius: 20px;
      padding: 18px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .board-empty-hint {
      text-align: center;
      color: var(--text-light);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .board-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .board-meaning-tag {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--primary);
    }

    .btn-sound {
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .board-big-text {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-main);
      margin: 6px 0;
      line-height: 1.35;
    }

    .board-harmonic-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #d97706;
      margin-bottom: 4px;
    }

    .board-romaji-text {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .board-actions-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-action-primary {
      flex: 1;
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #ffffff;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
    }

    .btn-action-clear {
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 情境分類按鈕列 (左右滑動導航) */
    .category-nav-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .cat-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      z-index: 5;
      flex-shrink: 0;
      transition: all 0.2s;
      user-select: none;
    }

    .cat-nav-btn:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      transform: scale(1.08);
    }

    .cat-nav-btn:active {
      transform: scale(0.92);
    }

    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px;
      scrollbar-width: none;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
      user-select: none;
      flex: 1;
    }

    .category-scroll.grabbing {
      cursor: grabbing;
      scroll-behavior: auto;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .cat-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
    }

    /* 詞彙卡片網格 */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 480px) {
      .vocab-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .word-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .word-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .word-card:active {
      transform: scale(0.97);
    }

    .word-card-zh {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .word-card-target {
      font-size: 0.82rem;
      color: var(--primary);
      font-weight: 600;
    }

    .word-card-harmonic {
      font-size: 0.72rem;
      color: #d97706;
      font-weight: 500;
    }

    /* 全螢幕大字出示模態視窗 */
    .fs-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      color: #0f172a;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .fs-modal.active {
      display: flex;
    }

    .fs-close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      font-size: 1.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fs-tip {
      font-size: 0.95rem;
      font-weight: 700;
      color: #8b5cf6;
      background: #ede9fe;
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    .fs-target-text {
      font-size: 2.8rem;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.35;
      margin-bottom: 16px;
    }

    .fs-harmonic-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: #d97706;
      margin-bottom: 8px;
    }

    .fs-zh-text {
      font-size: 1.2rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <span>🌐</span> 多國語言旅行小卡
    </div>
    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">☀️ 淺色</button>
  </header>

  <div class="app-wrap">

    <!-- 語言切換三標籤 -->
    <div class="lang-switcher-card">
      <button class="lang-pill-btn active" data-lang="ja" onclick="setLanguage('ja')">
        <span>🇯🇵</span> 日語 (Japanese)
      </button>
      <button class="lang-pill-btn" data-lang="ko" onclick="setLanguage('ko')">
        <span>🇰🇷</span> 韓語 (Korean)
      </button>
      <button class="lang-pill-btn" data-lang="en" onclick="setLanguage('en')">
        <span>🇺🇸</span> 英語 (English)
      </button>
    </div>

    <!-- 動態組句展示面板 -->
    <div class="sentence-board" id="sentenceBoard">
      <div class="board-empty-hint">
        💬 點選下方詞彙自動加到這裡（最多 3 句）<br>
        支援動態組句、多國語言真人發音與全螢幕大字出示
      </div>
    </div>

    <!-- 7 大情境分類標籤 (支援左右滑動與導航箭頭) -->
    <div class="category-nav-wrapper">
      <button type="button" class="cat-nav-btn" onclick="scrollCategory(-180)" title="向左滑動">‹</button>
      <div class="category-scroll" id="catScroll">
        <button class="cat-pill active" data-cat="basic" onclick="setCategory('basic')">基本禮貌</button>
        <button class="cat-pill" data-cat="dining" onclick="setCategory('dining')">餐飲美食</button>
        <button class="cat-pill" data-cat="shopping" onclick="setCategory('shopping')">購物退稅</button>
        <button class="cat-pill" data-cat="transport" onclick="setCategory('transport')">交通問路</button>
        <button class="cat-pill" data-cat="facility" onclick="setCategory('facility')">公共設施</button>
        <button class="cat-pill" data-cat="hotel" onclick="setCategory('hotel')">飯店住宿</button>
        <button class="cat-pill" data-cat="emergency" onclick="setCategory('emergency')">緊急應對</button>
      </div>
      <button type="button" class="cat-nav-btn" onclick="scrollCategory(180)" title="向右滑動">›</button>
    </div>

    <!-- 詞彙網格 -->
    <div class="vocab-grid" id="vocabGrid"></div>

  </div>

  <!-- 全螢幕大字視窗 (拿給店員看) -->
  <div class="fs-modal" id="fsModal">
    <button class="fs-close-btn" onclick="closeFullscreen()">✕</button>
    <div class="fs-tip">📱 請直接將螢幕出示給店員或路人查看</div>
    <div class="fs-target-text" id="fsTargetText">すみません</div>
    <div class="fs-harmonic-text" id="fsHarmonicText">斯咪媽現</div>
    <div class="fs-zh-text" id="fsZhText">不好意思</div>
  </div>

    let currentLang = 'ja';
    let currentCat = 'basic';
    let selectedPieces = [];

    function init() {
      renderVocabGrid();
      renderSentenceBoard();
      setupCategoryDragScroll();
      setupSwipeGesture();
    }

    // 滑鼠按住拖拉滑動 (Drag-to-Scroll)
    function setupCategoryDragScroll() {
      const slider = document.getElementById('catScroll');
      if (!slider) return;
      let isDown = false;
      let startX = 0;
      let scrollLeft = 0;

      slider.addEventListener('mousedown', (e) => {
        isDown = true;
        slider.classList.add('grabbing');
        startX = e.pageX - slider.offsetLeft;
        scrollLeft = slider.scrollLeft;
      });

      window.addEventListener('mouseup', () => {
        if (isDown) {
          isDown = false;
          slider.classList.remove('grabbing');
        }
      });

      slider.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 1.5;
        slider.scrollLeft = scrollLeft - walk;
      });
    }

    // 手機觸控卡片區左右滑動手勢 (Swipe Gesture) 切換情境
    function setupSwipeGesture() {
      const grid = document.getElementById('vocabGrid');
      if (!grid) return;
      const cats = ['basic', 'dining', 'shopping', 'transport', 'facility', 'hotel', 'emergency'];
      let touchStartX = 0;
      let touchStartY = 0;

      grid.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      grid.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        // 水平滑動大於 60px 且垂直位移小於 50px
        if (Math.abs(diffX) > 60 && Math.abs(diffY) < 50) {
          const currentIndex = cats.indexOf(currentCat);
          if (diffX < 0 && currentIndex < cats.length - 1) {
            // 向左滑 ➔ 下一個分類
            setCategory(cats[currentIndex + 1]);
          } else if (diffX > 0 && currentIndex > 0) {
            // 向右滑 ➔ 上一個分類
            setCategory(cats[currentIndex - 1]);
          }
        }
      }, { passive: true });
    }

    function setLanguage(lang) {
      currentLang = lang;
      selectedPieces = [];
      document.querySelectorAll('.lang-pill-btn').forEach(btn => {
        if (btn.getAttribute('data-lang') === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      renderVocabGrid();
      renderSentenceBoard();
    }

    function setCategory(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.classList.add('active');
          // 點選時平滑滾動至可視中央
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        } else {
          btn.classList.remove('active');
        }
      });
      renderVocabGrid();
    }

    // 左右導航按鈕點擊捲動
    function scrollCategory(offset) {
      const scrollEl = document.getElementById('catScroll');
      if (scrollEl) {
        scrollEl.scrollBy({ left: offset, behavior: 'smooth' });
      }
    }

    function renderVocabGrid() {
      const grid = document.getElementById('vocabGrid');
      const list = LanguageDB[currentLang].categories[currentCat] || [];
      grid.innerHTML = list.map((item, idx) => `
        <div class="word-card" onclick="addPiece(${idx})">
          <div class="word-card-zh">${item.zh}</div>
          <div class="word-card-target">${item.target}</div>
          <div class="word-card-harmonic">🗣️ ${item.harmonic}</div>
        </div>
      `).join('');
    }

    function addPiece(idx) {
      const item = LanguageDB[currentLang].categories[currentCat][idx];
      if (!item) return;
      if (selectedPieces.length >= 3) {
        selectedPieces.shift();
      }
      selectedPieces.push(item);
      renderSentenceBoard();
    }

    function clearPieces() {
      selectedPieces = [];
      renderSentenceBoard();
    }

    function renderSentenceBoard() {
      const board = document.getElementById('sentenceBoard');
      if (selectedPieces.length === 0) {
        board.innerHTML = `
          <div class="board-empty-hint">
            💬 點選下方詞彙自動加到這裡（最多 3 句）<br>
            支援動態組句、${LanguageDB[currentLang].name}真人發音與全螢幕大字出示
          </div>
        `;
        return;
      }

      const fullTarget = selectedPieces.map(p => p.target).join(' ');
      const fullHarmonic = selectedPieces.map(p => p.harmonic).join(' ・ ');
      const fullRomaji = selectedPieces.map(p => p.romaji).join(' ');
      const fullZh = selectedPieces.map(p => p.zh).join(' + ');

      board.innerHTML = `
        <div class="board-card-top">
          <span class="board-meaning-tag">中文：${fullZh}</span>
          <button class="btn-sound" onclick="speakText('${fullTarget}')">
            🔊 聽${LanguageDB[currentLang].name}發音
          </button>
        </div>
        <div class="board-big-text">${fullTarget}</div>
        <div class="board-harmonic-text">🗣️ 諧音：${fullHarmonic}</div>
        <div class="board-romaji-text">音標/拼音：${fullRomaji}</div>
        <div class="board-actions-row">
          <button class="btn-action-primary" onclick="showFullscreen('${fullTarget}', '${fullHarmonic}', '${fullZh}')">
            📱 放大拿給對方看
          </button>
          <button class="btn-action-clear" onclick="clearPieces()">清除</button>
        </div>
      `;
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        alert('您的瀏覽器不支援語音朗讀功能。');
        return;
      }
      window.speechSynthesis.cancel();
      const langConfig = LanguageDB[currentLang];
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langConfig.code;
      u.rate = langConfig.rate;
      window.speechSynthesis.speak(u);
    }

    function showFullscreen(target, harmonic, zh) {
      document.getElementById('fsTargetText').textContent = target;
      document.getElementById('fsHarmonicText').textContent = harmonic;
      document.getElementById('fsZhText').textContent = zh;
      document.getElementById('fsModal').classList.add('active');
    }

    function closeFullscreen() {
      document.getElementById('fsModal').classList.remove('active');
    }

    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.body.removeAttribute('data-theme');
        document.getElementById('themeToggleBtn').textContent = '☀️ 淺色';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggleBtn').textContent = '🌙 深色';
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
